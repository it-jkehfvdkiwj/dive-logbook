services:
  db:
    image: postgres:16-alpine
    container_name: divelog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: divelog
    ports:
      - "5432:5432"
    volumes:
      - divelog-data:/var/lib/postgresql/data

volumes:
  divelog-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1320" />
<title>Offline · Dive Log</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b1320; color: #e8eef5;
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 20px 0 6px; }
  p { color: #9fb0c3; margin: 0 0 24px; font-size: 15px; }
  button { font: inherit; font-weight: 600; background: #7fd0ea; color: #0b1320; border: 0; border-radius: 12px; padding: 12px 20px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Your dive log needs a connection to the server.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
